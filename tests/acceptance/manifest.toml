# Manifiesto de las pruebas de aceptación de v0.1.1. Solo el humano lo cambia (está sellado en el lock).
# Cada entrada nombra una prueba, dónde vive, qué regla de docs/spec/v0.1.1.md cubre, qué demuestra y qué mutación la
# haría fallar. `scripts/accept_check.py <fase>` comprueba que cada prueba de las fases hasta <fase> existe con ese nombre
# exacto en cada archivo indicado. Una prueba que falte o se renombre NO cuenta como aprobada.
#
# kind: "py" (pytest), "ts" (vitest), "sh" (deploy/tests/acceptance), "lab" (lab/scenarios/<name>.sh), "gate" (la puerta la mide).

[dependencies]
# Dependencias de prueba declaradas de antemano. El autor de pruebas NO añade dependencias: si necesita otra, la pide en
# docs/BLOCKERS.md y el humano la añade con scripts/update-lock.sh (backend) o pnpm con lockfile (frontend).
backend = ["pytest", "pytest-asyncio", "respx", "httpx (ya es dependencia del backend)"]
frontend = ["vitest", "jsdom", "axe-core (ya presentes en devDependencies)"]
deploy = ["bash", "shellcheck", "perl", "sqlite3", "ssh-keygen (los usa deploy/tests/run.sh)"]
lab = ["bash", "curl", "python3", "~/.pgui-lab.env (ver docs/hardening/BRIEF-OPENCODE.md)"]
doubles = "El doble de Proxmox para pruebas de aceptación se escribe en backend/tests/acceptance/doubles/ (sellado). No se usa ni se edita tests/fixtures/pve_responses.py, que el implementador sí puede tocar."

[[test]]
name = "test_scaffold_backend_runs"
phase = "F0"
kind = "py"
files = ["backend/tests/acceptance/test_scaffold.py"]
rules = []
proves = "El directorio de aceptación del backend se recoge y ejecuta con la configuración real de pytest"
mutation = "Renombrar el archivo a algo que pytest no recoja y comprobar que accept_check.py falla"

[[test]]
name = "scaffold_frontend_runs"
phase = "F0"
kind = "ts"
files = ["frontend/tests/acceptance/scaffold.test.ts"]
rules = []
proves = "El directorio de aceptación del frontend lo recoge vitest (patrón tests/**)"
mutation = "Cambiar la aserción a falsa y comprobar que pnpm test falla"

[[test]]
name = "scaffold_deploy_runs"
phase = "F0"
kind = "sh"
files = ["deploy/tests/acceptance/test_scaffold.sh"]
rules = []
proves = "El ejecutor deploy/tests/acceptance/run.sh encuentra y corre las pruebas de aceptación del instalador"
mutation = "Hacer que la prueba salga con 1 y comprobar que run.sh falla"

[[test]]
name = "selftest"
phase = "F0"
kind = "lab"
files = ["lab/selftest.sh"]
rules = []
proves = "El ejecutor de laboratorio no da por buena una corrida sin informe, con informe viejo, con pass=false o con código de salida distinto de 0, y limpia al fallar"
mutation = "Quitar la comprobación del código de salida, el borrado del informe previo o la lectura de pass en lab/run.sh (probado: selftest falla en las tres)"

[[test]]
name = "test_lock_has_no_known_vulns"
task = "F0.1"
phase = "F0"
kind = "gate"
files = ["gates.toml"]
rules = ["R-01", "R-02"]
proves = "pip-audit sobre backend/requirements.lock y pnpm audit --prod no encuentran vulnerabilidades"
mutation = "Fijar certifi a 2026.7.22 en el lock y comprobar que la puerta F0 falla"

