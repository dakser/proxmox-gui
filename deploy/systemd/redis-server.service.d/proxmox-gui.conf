# Redis for the GUI: unix socket only, no TCP (D7 / F-09). Command-line options
# override /etc/redis/redis.conf, so the distro config file stays untouched.
# proxmox-gui is in group `redis`; the socket is 0660 redis:redis.
[Service]
ExecStart=
ExecStart=/usr/bin/redis-server /etc/redis/redis.conf --supervised systemd --daemonize no --port 0 --unixsocket /run/redis/redis-server.sock --unixsocketperm 660
